<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b2b">
  <meta name="robots" content="noindex, nofollow">
  <title>Jamh Airlines</title>
  <style>
    :root{color-scheme:dark;--navy:#071b2b;--gold:#c8a96a;--cream:#f6f3ed}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 75% 15%,#173b50 0,transparent 42%),var(--navy);color:var(--cream);font-family:Arial,Helvetica,sans-serif}
    main{width:min(680px,100%);text-align:center;padding:54px 28px;border:1px solid #c8a96a66;background:#071b2bcc}
    .mark{width:64px;height:64px;margin:0 auto 20px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:italic 38px Georgia,serif}
    .eyebrow{color:#e6d3a6;font-size:10px;letter-spacing:.25em}
    h1{font:500 clamp(42px,8vw,68px)/1.05 Georgia,serif;margin:16px 0}
    p{color:#c4cdd0;font-size:14px;line-height:1.8}
    a{display:inline-block;margin-top:22px;padding:15px 23px;background:var(--gold);color:#071b2b;text-decoration:none;font-size:11px;font-weight:bold;letter-spacing:.05em}
    a:hover{background:#e6d3a6}
    footer{margin-top:32px;color:#8799a2;font-size:10px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">J</div>
    <div class="eyebrow">THE NATIONAL CARRIER OF JAMHIA</div>
    <h1>Jamh Airlines</h1>
    <p>Beyond the expected. Discover our fictional airline experience, explore the fleet, and plan a demo journey.</p>
    <a href="jamhairlines.html">ENTER THE JAMH AIRLINES WEBSITE ↗</a>
    <footer>A fictional airline and personal worldbuilding project.</footer>
  </main>
</body>
</html>
